name: Vantage APIs
meta:
  id: wrk_e117a7a3878b444f8201653fb7a36de7
  created: 1784898178259
  modified: 1784898178259
  description: >-
    All REST endpoints of the vantage pipeline against the local stack
    (make stack-up — also left running after make smoke). Base URLs live in
    the Base Environment; gpu_id defaults to a fixture GPU — replace with a
    real id from List GPUs. The MQ data plane (Produce/ProduceBatch/Consume)
    is gRPC on :50051 — use scripts/smoke/mqprobe for that.
collection:
  - name: Gateway (:8080)
    meta:
      id: fld_a0000000000000000000000000000001
      created: 1784898197001
      modified: 1784898197001
    children:
      - url: "{{ _.gateway }}/api/v1/gpus"
        name: List GPUs
        meta:
          id: req_a0000000000000000000000000000101
          created: 1784898197101
          modified: 1784898197101
          sortKey: -100
        method: GET
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.gateway }}/api/v1/gpus/{{ _.gpu_id }}/telemetry"
        name: Telemetry — latest (default page)
        meta:
          id: req_a0000000000000000000000000000102
          created: 1784898197102
          modified: 1784898197102
          sortKey: -99
        method: GET
      - url: "{{ _.gateway }}/api/v1/gpus/{{ _.gpu_id }}/telemetry"
        name: Telemetry — offset pagination (with total)
        meta:
          id: req_a0000000000000000000000000000103
          created: 1784898197103
          modified: 1784898197103
          sortKey: -98
        method: GET
        parameters:
          - name: limit
            value: "100"
          - name: offset
            value: "0"
      - url: "{{ _.gateway }}/api/v1/gpus/{{ _.gpu_id }}/telemetry"
        name: Telemetry — cursor pagination (keyset)
        meta:
          id: req_a0000000000000000000000000000104
          created: 1784898197104
          modified: 1784898197104
          sortKey: -97
          description: >-
            First call: send with only limit. Then copy pagination.next_cursor
            from the response into the cursor parameter (enable it) and
            re-send to walk pages in O(page). cursor and offset are mutually
            exclusive; cursor mode omits pagination.total by design.
        method: GET
        parameters:
          - name: limit
            value: "100"
          - name: cursor
            value: PASTE_next_cursor_HERE
            disabled: true
      - url: "{{ _.gateway }}/api/v1/gpus/{{ _.gpu_id }}/telemetry"
        name: Telemetry — time window (RFC3339)
        meta:
          id: req_a0000000000000000000000000000105
          created: 1784898197105
          modified: 1784898197105
          sortKey: -96
        method: GET
        parameters:
          - name: start_time
            value: "2026-07-24T00:00:00Z"
          - name: end_time
            value: "2026-07-25T00:00:00Z"
      - url: "{{ _.gateway }}/swagger/doc.json"
        name: OpenAPI spec (auto-generated)
