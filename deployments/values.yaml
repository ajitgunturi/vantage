# vantage umbrella chart values — LOCAL DEV / kind ONLY.
# Credentials mirror docker-compose.yml (vantage/vantage) intentionally;
# production would use a Kubernetes Secret + valueFrom.secretKeyRef.

mq:
  enabled: true
  image:
    repository: vantage/mq
    tag: dev
    pullPolicy: IfNotPresent  # D-06: user choice over Never
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

streamer:
  enabled: true
  image:
    repository: vantage/streamer
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

collector:
  enabled: true
  image:
    repository: vantage/collector
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

gateway:
  enabled: true
  image:
    repository: vantage/gateway
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    username: vantage
    password: vantage   # LOCAL DEV ONLY — same precedent as docker-compose.yml
    database: vantage

migrate:
  image:
    repository: vantage/migrate
    tag: dev
