# vantage umbrella chart values — LOCAL DEV / kind ONLY.
# Credentials mirror docker-compose.yml (vantage/vantage) intentionally;
# production would use a Kubernetes Secret + valueFrom.secretKeyRef.

mq:
  enabled: true
  image:
    repository: vantage/mq
    tag: dev
    pullPolicy: IfNotPresent  # D-06: user choice over Never
  # must cover drain (drainTimeoutMS) + GracefulStop race (5s) + HTTP (5s).
  terminationGracePeriodSeconds: 35
  # Delivery-hardening knobs. Defaults mirror internal/config.
  hardening:
    overflowPolicy: reject     # reject | drop-oldest | block
    maxDeliveries: 5           # deliveries before DLQ routing
    dlqCapacity: 1000          # bounded dead-letter lane
    retryBackoffBaseMS: 500    # redelivery visibility backoff base
    retryBackoffMaxMS: 30000   # redelivery visibility backoff cap
    leaseTTLMS: 30000          # unacked-lease reclaim deadline
    drainTimeoutMS: 20000      # SIGTERM drain window
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

streamer:
  enabled: true
  # replicaCount: number of Streamer replicas (spec supports up to 10 — TestStream_Concurrent10).
  # Override with --set streamer.replicaCount=N for scale-out.
  replicaCount: 1
  # useFixtureConfigMap: true mounts the 3-GPU fixture ConfigMap over /data,
  # shadowing the image-baked CSV (real DCGM export, 247 GPUs, when built on
  # the dev machine). Set true only to force the tiny deterministic fixture.
  useFixtureConfigMap: false
  image:
    repository: vantage/streamer
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

collector:
  enabled: true
  # replicaCount: number of Collector replicas (each instance gets unique messages from MQ).
  # Override with --set collector.replicaCount=N for throughput scale-out.
  replicaCount: 1
  image:
    repository: vantage/collector
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "50m"
      memory: "16Mi"
    limits:
      cpu: "100m"
      memory: "64Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6

gateway:
  enabled: true
  image:
    repository: vantage/gateway
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    username: vantage
    password: vantage   # LOCAL DEV ONLY — same precedent as docker-compose.yml
    database: vantage

migrate:
  image:
    repository: vantage/migrate
    tag: dev
