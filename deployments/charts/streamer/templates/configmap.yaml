{{- if and .Values.enabled .Values.useFixtureConfigMap }}
# Fixture DCGM CSV for the streamer in kind — OPT-IN via useFixtureConfigMap.
# Default deployment uses the CSV baked into the streamer image at /data
# (real dcgm_metrics_*.csv when built on the dev machine, committed fixture
# otherwise — see build/streamer.Dockerfile). The real 1.1MB CSV cannot ship
# via ConfigMap: it exceeds the 1MiB ConfigMap/etcd size limit. 12-column
# layout mirrors test/e2e/pipeline_test.go writeFixtureCSV — distinct
# (uuid, metric_name) pairs so exactly-once assertions hold.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-streamer-fixture
  labels:
    app.kubernetes.io/name: streamer
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
