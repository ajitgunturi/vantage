{{- if .Values.enabled }}
# MQ broker Deployment.
# NOTE (D-04, OPS-04, ADR-001): replicas and strategy are HARDCODED —
# the MQ is an in-memory broker; multi-replica is undefined behaviour
# (split-brain). Never template these from values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mq
  labels:
    app.kubernetes.io/name: mq
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1                 # LOCKED: in-memory broker — never scale
  strategy:
    type: Recreate            # LOCKED: new pod only after old terminates
  selector:
    matchLabels:
      app.kubernetes.io/name: mq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: mq
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # preStop drain: SIGTERM makes the broker refuse Produce (readiness
      # flips) while consumers keep acking the backlog for up to
      # MQ_DRAIN_TIMEOUT_MS, then it exits. The grace period must cover
      # drain (20s) + GracefulStop race (5s) + HTTP shutdown (5s).
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 35 }}
      containers:
        - name: mq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          env:
            - name: MQ_GRPC_ADDR
              value: ":50051"
            - name: MQ_HTTP_ADDR
              value: ":8080"
            - name: MQ_BUFFER_SIZE
              value: "10000"
            - name: MQ_CONSUME_CREDIT
              value: "20"
            # Delivery-hardening knobs — values.yaml `hardening`.
            - name: MQ_OVERFLOW_POLICY
              value: {{ .Values.hardening.overflowPolicy | quote }}
            - name: MQ_MAX_DELIVERIES
              value: {{ .Values.hardening.maxDeliveries | quote }}
            - name: MQ_DLQ_CAPACITY
              value: {{ .Values.hardening.dlqCapacity | quote }}
            - name: MQ_RETRY_BACKOFF_BASE_MS
              value: {{ .Values.hardening.retryBackoffBaseMS | quote }}
            - name: MQ_RETRY_BACKOFF_MAX_MS
              value: {{ .Values.hardening.retryBackoffMaxMS | quote }}
            - name: MQ_LEASE_TTL_MS
              value: {{ .Values.hardening.leaseTTLMS | quote }}
            - name: MQ_DRAIN_TIMEOUT_MS
              value: {{ .Values.hardening.drainTimeoutMS | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .httpGet.path }}
              port: {{ .httpGet.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .httpGet.path }}
              port: {{ .httpGet.port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
{{- end }}
