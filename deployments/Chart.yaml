apiVersion: v2
name: vantage
description: Elastic GPU Telemetry Pipeline — umbrella chart (4 service sub-charts + PostgreSQL)
type: application
version: 0.1.0
appVersion: "dev"

dependencies:
  - name: mq
    version: "0.1.0"
    condition: mq.enabled
  - name: streamer
    version: "0.1.0"
    condition: streamer.enabled
  - name: collector
    version: "0.1.0"
    condition: collector.enabled
  - name: gateway
    version: "0.1.0"
    condition: gateway.enabled
  - name: postgresql
    version: "18.7.8"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
