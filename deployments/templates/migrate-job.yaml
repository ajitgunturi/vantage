# Schema migration hook Job (D-09/D-10/D-11).
# Runs vantage/migrate:dev to completion BEFORE any service pods roll
# (pre-install + pre-upgrade). The umbrella chart owns this Job because the
# schema is a shared concern (collector writes, gateway reads).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never   # fail loudly; do not restart on migration error
      initContainers:
        # Helm 4 hooks exit immediately on Job failure (Pitfall 7) — block
        # until Postgres accepts TCP connections so migrate never false-fails
        # while the Bitnami StatefulSet is still starting.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "waiting for {{ .Release.Name }}-postgresql:5432 ..."
                sleep 2
              done
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: VANTAGE_DB_DSN
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
