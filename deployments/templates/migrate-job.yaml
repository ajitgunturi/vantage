# Schema migration hook Job (D-09/D-10/D-11).
# Runs vantage/migrate:dev to completion AFTER Helm applies all regular release
# resources (post-install,post-upgrade). The umbrella chart owns this Job because
# the schema is a shared concern (collector writes, gateway reads).
#
# Hook ordering: post-install,post-upgrade means all regular manifests (including
# the Bitnami postgresql StatefulSet and Service) are created BEFORE this hook
# runs. The wait-for-postgres init container can therefore resolve
# {{ .Release.Name }}-postgresql:5432 — no circular wait.
#
# Bounded failure: activeDeadlineSeconds:120 on the Job spec ensures a stuck
# migration fails loudly within 2 minutes (vs. silently hanging to Helm's 5m
# default). Combined with --timeout 3m on helm upgrade, any stall produces a
# named, time-bounded error.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never   # fail loudly; do not restart on migration error
      initContainers:
        # Postgres is a regular release resource applied before this post-install
        # hook runs — the wait resolves without deadlock. Block here until
        # Postgres accepts TCP so migrate never false-fails during StatefulSet
        # startup (all-clear before the main migrate container begins DDL).
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-postgresql 5432; do
                echo "waiting for {{ .Release.Name }}-postgresql:5432 ..."
                sleep 2
              done
      containers:
        - name: migrate
          image: "{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: VANTAGE_DB_DSN
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
