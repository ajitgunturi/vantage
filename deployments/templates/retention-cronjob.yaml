{{- if .Values.retention.enabled }}
# Nightly telemetry retention: O(1) partition drops + forward partition
# pre-creation. Owned by the umbrella chart for the same reason as the migrate
# Job — the schema is a shared concern.
#
# Each run executes two SQL functions installed by migration 000003:
#   gpu_metrics_drop_old_partitions(days) — drop whole daily partitions older
#     than the retention window (metadata-only; no DELETE bloat, no vacuum churn)
#   gpu_metrics_ensure_partitions(ahead)  — pre-create upcoming daily
#     partitions so the write path never waits on DDL
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-retention
  labels:
    app.kubernetes.io/name: retention
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: retention
              # The Bitnami postgresql image is already in the cluster (chart
              # dependency) — reuse it for psql instead of pulling another image.
              image: docker.io/bitnami/postgresql:17
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  value: {{ .Values.postgresql.auth.password | quote }}
              command:
                - psql
                - -h
                - {{ .Release.Name }}-postgresql
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database }}
                - -v
                - ON_ERROR_STOP=1
                - -c
                - >-
                  SELECT gpu_metrics_drop_old_partitions({{ .Values.retention.days }})
                    AS partitions_dropped;
                - -c
                - >-
                  SELECT gpu_metrics_ensure_partitions({{ .Values.retention.precreateDays }})
                    AS partitions_created;
{{- end }}
